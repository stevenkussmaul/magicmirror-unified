services:
  magicmirror:
    image: skussmaul/magicmirror-unified
    container_name: magicmirror
    user: 568:568
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 2
    networks:
      macvlan_mm:
        ipv4_address: 192.168.54.12
    volumes:
      - /mnt/apps/configs/magicmirror/config:/opt/magicmirror/config
      - /mnt/apps/configs/magicmirror/modules:/opt/magicmirror/modules
      - /mnt/apps/configs/magicmirror/css:/opt/magicmirror/css
      - /mnt/apps/configs/magicmirror/mmpm:/home/apps/.config/mmpm
    environment:
      - TZ=America/New_York
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "1"

networks:
  macvlan_mm:
    driver: macvlan
    driver_opts:
      parent: br1
    ipam:
      config:
        - subnet: 192.168.54.0/24
          gateway: 192.168.54.1
